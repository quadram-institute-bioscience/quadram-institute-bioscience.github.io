document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"30c746f8-d1ca-4127-9641-4e502c6db192\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Quadram Institute brand webfonts.\n   FS Sinclair — brand display / headings (the rounded geometric face used in the logo).\n   DIN — labels, UI, data, running text. */\n\n@font-face {\n  font-family: \"FS Sinclair\";\n  src: url(\"a539cc93-d3a0-46af-94c0-1d1619b3772b\") format(\"opentype\");\n  font-weight: 300; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"FS Sinclair\";\n  src: url(\"23d1eff6-f47e-4df2-962f-2d9786b29b90\") format(\"opentype\");\n  font-weight: 300; font-style: italic; font-display: swap;\n}\n@font-face {\n  font-family: \"FS Sinclair\";\n  src: url(\"05e0f9bb-4057-4c21-a2fc-f93dc6e730ae\") format(\"opentype\");\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"FS Sinclair\";\n  src: url(\"75b212fc-8285-4f1b-9551-2e90423db387\") format(\"opentype\");\n  font-weight: 500; font-style: italic; font-display: swap;\n}\n@font-face {\n  font-family: \"FS Sinclair\";\n  src: url(\"894c2a24-4bce-4cbc-a57d-afb83996e877\") format(\"opentype\");\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"FS Sinclair\";\n  src: url(\"5ab658b0-ee31-4cd9-9ea5-36ad7e44f301\") format(\"opentype\");\n  font-weight: 700; font-style: italic; font-display: swap;\n}\n\n@font-face {\n  font-family: \"DIN\";\n  src: url(\"342d78c2-9fbb-448e-81c5-be571646a7ec\") format(\"truetype\");\n  font-weight: 300; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"DIN\";\n  src: url(\"1eb3fbe5-2282-4bde-90aa-dde9977570ea\") format(\"truetype\");\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"DIN\";\n  src: url(\"4dd3109d-b6ae-412c-9f0a-2721c063f1f7\") format(\"truetype\");\n  font-weight: 500; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"DIN\";\n  src: url(\"1326007a-2629-4870-8c95-aa4babb95389\") format(\"opentype\");\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"DIN Alternate\";\n  src: url(\"3048d004-2f7e-4301-976a-1efb3ca8c5b9\") format(\"truetype\");\n  font-weight: 900; font-style: normal; font-display: swap;\n}\n<\u002Fstyle>\n<style>/* Quadram Institute colour system.\n   Primary palette structures the page; secondary palette is reserved for\n   highlights, charts and data series. */\n\n:root {\n  /* ---- Primary palette ---- */\n  --qi-antiflash-white: #F0F1F1; /* backgrounds, light surfaces */\n  --qi-charcoal:        #2F3D46; /* text, dark backgrounds */\n  --qi-dark-green:      #097E74; /* primary accent — buttons, links, key data */\n  --qi-acid-green:      #B6BE00; /* high-impact — always paired with charcoal */\n\n  /* Brand teal from the logo diamond mark */\n  --qi-diamond-teal:    #009B84;\n\n  /* ---- Secondary palette (highlights, charts, infographics) ---- */\n  --qi-dark-orange:  #CF4520;\n  --qi-light-orange: #FF9E1B;\n  --qi-grass-green:  #48A23F;\n  --qi-cerulean:     #00778B;\n\n  /* ---- Neutral ramp (derived from charcoal / antiflash white) ---- */\n  --qi-white:      #FFFFFF;\n  --qi-neutral-50: #F0F1F1;\n  --qi-neutral-100:#E2E5E6;\n  --qi-neutral-200:#C9CFD1;\n  --qi-neutral-300:#A7B0B4;\n  --qi-neutral-400:#7E8B91;\n  --qi-neutral-500:#5C6b72;\n  --qi-neutral-600:#45535B;\n  --qi-neutral-700:#2F3D46;\n  --qi-neutral-900:#1B252B;\n\n  /* ---- Tints for surfaces & chart fills ---- */\n  --qi-dark-green-tint:  #E1EEEC;\n  --qi-acid-green-tint:  #F2F3D2;\n  --qi-cerulean-tint:    #DDEBEE;\n  --qi-orange-tint:      #FCE7DE;\n\n  /* ---- Semantic aliases ---- */\n  --surface-page:      var(--qi-antiflash-white);\n  --surface-card:      var(--qi-white);\n  --surface-inverse:   var(--qi-charcoal);\n  --surface-accent:    var(--qi-dark-green);\n  --surface-muted:     var(--qi-neutral-100);\n\n  --text-body:         var(--qi-charcoal);\n  --text-muted:        var(--qi-neutral-500);\n  --text-inverse:      var(--qi-antiflash-white);\n  --text-accent:       var(--qi-dark-green);\n  --text-on-accent:    #FFFFFF;\n  --text-on-acid:      var(--qi-charcoal);\n\n  --border-subtle:     var(--qi-neutral-200);\n  --border-strong:     var(--qi-charcoal);\n  --border-accent:     var(--qi-dark-green);\n\n  --accent-primary:    var(--qi-dark-green);\n  --accent-impact:     var(--qi-acid-green);\n\n  /* Focus / interaction */\n  --focus-ring:        var(--qi-dark-green);\n\n  /* Ordered chart data series */\n  --chart-1: var(--qi-dark-green);\n  --chart-2: var(--qi-acid-green);\n  --chart-3: var(--qi-cerulean);\n  --chart-4: var(--qi-light-orange);\n  --chart-5: var(--qi-grass-green);\n  --chart-6: var(--qi-dark-orange);\n\n  /* Semantic status */\n  --status-success: var(--qi-grass-green);\n  --status-warning: var(--qi-light-orange);\n  --status-danger:  var(--qi-dark-orange);\n  --status-info:    var(--qi-cerulean);\n}\n<\u002Fstyle>\n<style>/* Quadram Institute typography.\n   Display / headings: FS Sinclair (brand face).\n   UI, labels, data & running text: DIN.\n   Calibri is the Microsoft-Office fallback per brand guidelines. */\n\n:root {\n  --font-display: \"FS Sinclair\", \"DIN\", Calibri, Candara, \"Segoe UI\", Arial, sans-serif;\n  --font-body:    \"DIN\", Calibri, Candara, \"Segoe UI\", Arial, sans-serif;\n  --font-data:    \"DIN Alternate\", \"DIN\", Calibri, \"Segoe UI\", Arial, sans-serif;\n\n  /* Weights */\n  --fw-light:   300; /* @kind font */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n\n  /* Type scale (rem, 16px base) */\n  --text-2xs: 0.6875rem;  /* 11px — micro labels */\n  --text-xs:  0.75rem;    /* 12px — captions, eyebrows */\n  --text-sm:  0.875rem;   /* 14px — secondary UI */\n  --text-md: e · Health<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 6vw, 5rem); line-height: 0.98; letter-spacing: -0.015em; margin: 0; max-width: 20ch; text-wrap: balance;\">Understanding food and the gut to keep people healthy.<\u002Fh1>\n      <p style=\"font-size: 1.1875rem; line-height: 1.6; color: var(--qi-neutral-600); max-width: 62ch; margin: 1.6rem 0 2.2rem;\">We are an interdisciplinary research institute on the Norwich Research Park, working across food science, gut microbiology and clinical research to prevent disease and improve health across the lifecourse.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 0.9rem;\">\n        <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Button\" variant=\"primary\" size=\"lg\" hint-size=\"180px,48px\">Explore our research<\u002Fx-import>\n        <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Button\" variant=\"secondary\" size=\"lg\" hint-size=\"150px,48px\">About the Institute<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 0 2rem 3.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem;\">\n      <a href=\"#research\" style=\"text-decoration: none;\">\n        <div style=\"background: var(--qi-dark-green); color: #fff; border-radius: var(--radius-md); padding: 1.6rem; height: 100%; display: flex; flex-direction: column; gap: 0.5rem; min-height: 172px;\" style-hover=\"background: var(--qi-diamond-teal)\">\n          <span style=\"font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.75;\">For researchers<\u002Fspan>\n          <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; margin-top: auto;\">Research programmes<\u002Fspan>\n          <span style=\"font-size: 0.9375rem; opacity: 0.85;\">Four themes, 40+ groups, open collaboration.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#work\" style=\"text-decoration: none;\">\n        <div style=\"background: var(--qi-acid-green); color: var(--qi-charcoal); border-radius: var(--radius-md); padding: 1.6rem; height: 100%; display: flex; flex-direction: column; gap: 0.5rem; min-height: 172px;\" style-hover=\"filter: brightness(1.06)\">\n          <span style=\"font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.7;\">For industry &amp; funders<\u002Fspan>\n          <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; margin-top: auto;\">Partner with us<\u002Fspan>\n          <span style=\"font-size: 0.9375rem;\">Contract research, facilities access, co-investment.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#news\" style=\"text-decoration: none;\">\n        <div style=\"background: #fff; color: var(--qi-charcoal); border: 1px solid var(--border-subtle); border-top: 4px solid var(--qi-cerulean); border-radius: var(--radius-md); padding: 1.6rem; height: 100%; display: flex; flex-direction: column; gap: 0.5rem; min-height: 172px;\" style-hover=\"border-color: var(--qi-cerulean)\">\n          <span style=\"font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--qi-neutral-500);\">For media<\u002Fspan>\n          <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; margin-top: auto;\">Newsroom<\u002Fspan>\n          <span style=\"font-size: 0.9375rem; color: var(--qi-neutral-600);\">Press releases, expert comment, image library.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"research\" style=\"max-width: 1240px; margin: 0 auto; padding: 5rem 2rem 1rem;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem; margin-bottom: 2.5rem;\">\n      <div>\n        <span class=\"qi-eyebrow\">Research themes<\u002Fspan>\n        <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 3.4vw, 3rem); line-height: 1.05; letter-spacing: -0.01em; margin: 0.7rem 0 0; max-width: 26ch;\">Four themes, one question: how does food shape health?<\u002Fh2>\n      <\u002Fdiv>\n      <a href=\"#\" style=\"font-weight: 700; font-size: 0.9375rem;\">All research groups →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.25rem;\">\n      <sc-for list=\"{{ themes }}\" as=\"theme\" hint-placeholder-count=\"4\">\n        <div style=\"background: #fff; border: 1px solid var(--qi-neutral-100); border-top: 4px solid var(--qi-dark-green); border-radius: var(--radius-md); padding: 1.5rem; display: flex; flex-direction: column; gap: 0.65rem;\" style-hover=\"box-shadow: var(--shadow-md)\">\n          <span style=\"font-family: var(--font-data); font-size: 0.8125rem; font-weight: 700; color: var(--qi-dark-green); letter-spacing: 0.08em;\">{{ theme.no }}<\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.3125rem; line-height: 1.15; margin: 0;\">{{ theme.title }}<\u002Fh3>\n          <p style=\"font-size: 0.9375rem; line-height: 1.55; color: var(--qi-neutral-600); margin: 0;\">{{ theme.body }}<\u002Fp>\n          <span style=\"font-size: 0.8125rem; color: var(--qi-neutral-500); margin-top: auto; padding-top: 0.8rem;\">{{ theme.meta }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1240px; margin: 0 auto; padding: 4.5rem 2rem;\">\n    <div style=\"background: var(--qi-charcoal); color: var(--qi-antiflash-white); border-radius: var(--radius-md); overflow: hidden; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));\">\n      <div style=\"min-height: 380px; position: relative;\">\n        <image-slot id=\"qi-spotlight\" shape=\"rect\" placeholder=\"Drop the spotlight image (lab or clinical research photo)\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"padding: 3rem 2.75rem; display: flex; flex-direction: column; justify-content: center; gap: 1.1rem;\">\n        <div style=\"display: flex; align-items: center; gap: 0.6rem;\">\n          <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Badge\" tone=\"impact\" hint-size=\"90px,22px\">Spotlight<\u002Fx-import>\n          <span style=\"font-size: 0.8125rem; color: var(--qi-neutral-300);\">Gut microbes and health<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 2.8vw, 2.5rem); line-height: 1.08; margin: 0; max-width: 24ch;\">Mapping the infant gut microbiome across the first 1,000 days<\u002Fh2>\n        <p style=\"font-size: 1.0625rem; line-height: 1.6; color: var(--qi-neutral-200); max-width: 52ch; margin: 0;\">A five-year cohort study with the Norfolk and Norwich University Hospital is tracking how early feeding, antibiotics and birth mode shape the microbial communities that set up lifelong immune health.<\u002Fp>\n        <div style=\"display: flex; gap: 2.5rem; margin: 0.6rem 0 0.4rem;\">\n          <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Stat\" value=\"1,240\" label=\"Infants enrolled\" accent=\"acid-green\" hint-size=\"140px,90px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Stat\" value=\"18\" label=\"Partner sites\" accent=\"acid-green\" hint-size=\"120px,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div>\n          <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Button\" variant=\"impact\" hint-size=\"150px,44px\">Read the study<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"news\" style=\"max-width: 1240px; margin: 0 auto; padding: 1rem 2rem 4rem;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem; margin-bottom: 1.6rem;\">\n      <div>\n        <span class=\"qi-eyebrow\">Latest<\u002Fspan>\n        <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 3vw, 2.6rem); line-height: 1.05; margin: 0.7rem 0 0;\">News, publications and events<\u002Fh2>\n      <\u002Fdiv>\n      <a href=\"#\" style=\"font-weight: 700; font-size: 0.9375rem;\">Newsroom →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"border-bottom: 1px solid var(--border-subtle); margin-bottom: 2rem;\">\n      <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Tabs\" tabs=\"{{ newsTabs }}\" value=\"{{ activeTab }}\" sc-camel-on-change=\"{{ setTab }}\" hint-size=\"100%,44px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;\">\n      <sc-for list=\"{{ visibleItems }}\" as=\"item\" hint-placeholder-count=\"3\">\n        <a href=\"#\" style=\"text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 0.9rem;\" style-hover=\"color: var(--qi-dark-green)\">\n          <div style=\"aspect-ratio: 3 / 2; width: 100%; position: relative;\">\n            <image-slot id=\"{{ item.slot }}\" radius=\"8\" placeholder=\"{{ item.placeholder }}\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 0.6rem;\">\n            <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Badge\" tone=\"{{ item.tone }}\" size=\"sm\" hint-size=\"70px,20px\">{{ item.kind }}<\u002Fx-import>\n            <span style=\"font-size: 0.8125rem; color: var(--qi-neutral-500);\">{{ item.date }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.1875rem; line-height: 1.2; margin: 0;\">{{ item.title }}<\u002Fh3>\n          <p style=\"font-size: 0.9375rem; line-height: 1.55; color: var(--qi-neutral-600); margin: 0;\">{{ item.body }}<\u002Fp>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showFacilities }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"facilities\" style=\"background: #fff; border-top: 1px solid var(--qi-neutral-100); border-bottom: 1px solid var(--qi-neutral-100);\">\n      <div style=\"max-width: 1240px; margin: 0 auto; padding: 4.5rem 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; align-items: center;\">\n        <div>\n          <span class=\"qi-eyebrow\">Facilities<\u002Fspan>\n          <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 3vw, 2.6rem); line-height: 1.05; margin: 0.7rem 0 1.1rem; max-width: 22ch;\">National-capability science, open to collaborators<\u002Fh2>\n          <p style=\"font-size: 1.0625rem; line-height: 1.6; color: var(--qi-neutral-600); max-width: 54ch; margin: 0 0 1.8rem;\">Our building brings research laboratories, an endoscopy centre and a clinical trials unit under one roof. Capability is available to academic and commercial partners through managed access.<\u002Fp>\n          <div style=\"display: grid; gap: 0.9rem; margin-bottom: 2rem;\">\n            <sc-for list=\"{{ facilities }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; align-items: baseline; gap: 0.75rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--qi-neutral-100);\">\n                <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.DiamondMark\" size=\"{{ 9 }}\" hint-size=\"9px,9px\"><\u002Fx-import>\n                <span style=\"font-weight: 700; font-size: 0.9375rem;\">{{ f.name }}< ; display: flex; align-items: baseline; gap: 0.6rem;\">\n          <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; color: var(--qi-dark-green);\">14<\u002Fspan>\n          <span style=\"font-size: 0.9375rem; color: var(--qi-neutral-500);\">open vacancies<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"#\" style=\"font-weight: 700; font-size: 0.9375rem;\">See all roles →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--qi-neutral-100); border-radius: var(--radius-md); padding: 2.25rem; display: flex; flex-direction: column; gap: 0.8rem;\">\n        <span class=\"qi-eyebrow\">Collaborate<\u002Fspan>\n        <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; margin: 0;\">Industry and policy partners<\u002Fh3>\n        <p style=\"font-size: 0.9375rem; line-height: 1.6; color: var(--qi-neutral-600); margin: 0;\">Joint programmes, sponsored studentships and consultancy with food manufacturers, health providers and government bodies.<\u002Fp>\n        <div style=\"margin-top: auto; padding-top: 1.4rem;\">\n          <a href=\"#\" style=\"font-weight: 700; font-size: 0.9375rem;\">Talk to the business team →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--qi-dark-green-tint); border: 1px solid var(--qi-dark-green); border-radius: var(--radius-md); padding: 2.25rem; display: flex; flex-direction: column; gap: 0.8rem;\">\n        <span class=\"qi-eyebrow\">Newsletter<\u002Fspan>\n        <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; margin: 0;\">Research digest, monthly<\u002Fh3>\n        <p style=\"font-size: 0.9375rem; line-height: 1.6; color: var(--qi-neutral-600); margin: 0;\">New findings, publications and events, summarised for non-specialists.<\u002Fp>\n        <div style=\"margin-top: auto; padding-top: 1.4rem; display: flex; flex-direction: column; gap: 0.8rem;\">\n          <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Input\" label=\"Email address\" placeholder=\"you@organisation.org\" hint-size=\"100%,68px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.Button\" variant=\"primary\" hint-size=\"110px,44px\">Subscribe<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: var(--qi-charcoal); color: var(--qi-antiflash-white); margin-top: 1rem;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 4rem 2rem 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 2.5rem;\">\n      <div style=\"display: flex; flex-direction: column; gap: 1rem;\">\n        <div style=\"display: flex; align-items: center; gap: 0.7rem;\">\n          <x-import component-from-global-scope=\"QuadramInstituteDesignSystem_b317f0.DiamondMark\" size=\"{{ 22 }}\" color=\"var(--qi-acid-green)\" hint-size=\"22px,22px\"><\u002Fx-import>\n          <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;\">Quadram Institute Bioscience<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size: 0.875rem; line-height: 1.6; color: var(--qi-neutral-300); margin: 0;\">Rosalind Franklin Road<br>Norwich Research Park<br>Norwich NR4 7UQ<br>United Kingdom<\u002Fp>\n        <a href=\"#\" style=\"font-size: 0.875rem; color: var(--qi-acid-green);\">+44 (0)1603 255000<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 0.6rem; font-size: 0.9rem;\">\n        <span style=\"font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--qi-neutral-400); margin-bottom: 0.4rem;\">Research<\u002Fspan>\n        <a href=\"#\" style=\"color: var(--qi-antiflash-white);\">Research themes<\u002Fa>\n        <a href=\"#\" style=\"color: var(--qi-  gap: 1.25rem;\">\n        <a href=\"#\" style=\"color: var(--qi-neutral-300);\">Privacy<\u002Fa>\n        <a href=\"#\" style=\"color: var(--qi-neutral-300);\">Accessibility<\u002Fa>\n        <a href=\"#\" style=\"color: var(--qi-neutral-300);\">Freedom of information<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showUtilityBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showFacilities&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;newsCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nconst ITEMS = [\n  { kind: \"News\", tone: \"accent\", date: \"2 September 2026\", title: \"Gut bacteria found to modify how dietary fibre lowers cholesterol\", body: \"A collaboration with the Institute of Food Research identifies two Bacteroides species that drive the effect in a human intervention study.\", slot: \"qi-news-1\", placeholder: \"News image\", group: \"news\" },\n  { kind: \"Publication\", tone: \"info\", date: \"28 August 2026\", title: \"Genomic surveillance of Salmonella in the UK poultry supply chain\", body: \"Nature Microbiology. Whole-genome sequencing of 4,300 isolates reveals persistent lineages across three processing regions.\", slot: \"qi-news-2\", placeholder: \"Publication figure\", group: \"publications\" },\n  { kind: \"Event\", tone: \"impact\", date: \"17 October 2026\", title: \"Quadram Annual Science Meeting: diet, immunity and ageing\", body: \"A one-day meeting at the Institute for researchers and industry partners. Registration is open until 3 October.\", slot: \"qi-news-3\", placeholder: \"Event photo\", group: \"events\" },\n  { kind: \"News\", tone: \"accent\", date: \"14 August 2026\", title: \"£4.2m award to study antimicrobial resistance in the food chain\", body: \"The programme will trace resistance genes from farm to fork across four European partner countries.\", slot: \"qi-news-4\", placeholder: \"News image\", group: \"news\" },\n  { kind: \"Publication\", tone: \"info\", date: \"6 August 2026\", title: \"Bile acid signalling in the ageing colon: a systematic review\", body: \"Gut. Evidence from 62 studies on how microbial bile acid metabolism shifts with age.\", slot: \"qi-news-5\", placeholder: \"Publication figure\", group: \"publications\" },\n  { kind: \"Event\", tone: \"impact\", date: \"5 November 2026\", title: \"Public lecture: what your microbiome can and cannot tell you\", body: \"An evening talk at the Norwich Research Park, free and open to all.\", slot: \"qi-news-6\", placeholder: \"Event photo\", group: \"events\" }\n];\n\nclass Component extends DCLogic {\n  state = { tab: \"all\" };\n\n  renderVals() {\n    const tab = this.state.tab;\n    const count = this.props.newsCount ?? 3;\n    const filtered = tab === \"all\" ? ITEMS : ITEMS.filter(i => i.group === tab);\n    return {\n      showUtilityBar: this.props.showUtilityBar ?? true,\n      showFacilities: this.props.showFacilities ?? true,\n      activeTab: tab,\n      setTab: id => this.setState({ tab: id }),\n      newsTabs: [\n        { id: \"all\", label: \"All\" },\n        { id: \"news\", label: \"News\" },\n        { id: \"publications\", label: \"Publications\" },\n        { id: \"events\", label: \"Events\" }\n      ],\n      visibleItems: filtered.slice(0, count),\n      themes: [\n        { no: \"01\", title: \"Microbes and food safety\", body: \"Tracking foodborne pathogens through the supply chain with genomics, and finding the interventions that stop them.\", meta: \"11 research groups\" },\n        { no: \"02\", title: \"Food innovation and health\", body: \"Reformulating what we eat — fibre, protein and plant compounds — so that healthier diets are also realistic ones.\", meta: \"9 research groups\" },\n        { no: \"03\", title: \"Gut microbes and health\", body: \"How microbial communities develop, what they metabolise, and how they shape immunity and inflammation.\", meta: \"14 research groups\" },\n        { no: \"04\", title: \"Population health and epidemiology\", body: \"Linking diet, microbiome and clinical data at scale to explain disease risk across the lifecourse.\", meta: \"7 research groups\" }\n      ],\n      facilities: [\n        { name: \"Clinical Research Facility\", detail: \"12 beds, MHRA-compliant\" },\n        { name: \"Endoscopy Centre\", detail: \"Shared with NNUH\" },\n        { name: \"Genomics and sequencing\", detail: \"Long- and short-read\" },\n        { name: \"Metabolomics and imaging\", detail: \"NMR, LC-MS, cryo-EM access\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
