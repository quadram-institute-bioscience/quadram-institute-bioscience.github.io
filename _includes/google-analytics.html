{% if jekyll.environment == "production" %}
    {% assign gid = site.env.NETLIFY_GOOGLE_ANALYTICS_ID | default: site.google_analytics_id %}
    {% if gid and gid != "" %}
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '{{ gid }}');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id={{ gid }}';
          s.async = true;
          document.head.appendChild(s);
        }
        if (window.requestIdleCallback) {
          window.addEventListener('load', function () {
            window.requestIdleCallback(loadGtag, { timeout: 3000 });
          });
        } else {
          window.addEventListener('load', function () {
            setTimeout(loadGtag, 1000);
          });
        }
      })();
    </script>
    {% endif %}
{% endif %}
