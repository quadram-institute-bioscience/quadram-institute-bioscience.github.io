url: "https://quadram-institute-bioscience.github.io"
baseurl: ""
exclude: ['README.md']
permalink: pretty
title: 'Core Bionformatics at the Quadram Institute Bioscience'

google_analytics_id: ""
homepage:
  show_call_box: true
logo:
  mobile: "images/logo/logo-mobile.svg"
  desktop: "images/logo/logo-dark.svg"
  desktop_height: "36px"
footer:
  copyright_text: '&copy; 2020-2026, Quadram Institute Bioscience - <a href="https://github.com/quadram-institute-bioscience/quadram-institute-bioscience.github.io/actions/workflows/pages/pages-build-deployment"><img src="https://github.com/quadram-institute-bioscience/quadram-institute-bioscience.github.io/actions/workflows/pages/pages-build-deployment/badge.svg" alt="pages-build-deployment" /></a>, theme by <a href="https://www.zerostatic.io/">Zerostatic</a>'
excerpt_separator: <!--more-->

seo:
  meta_og_title: "Core Bionformatics at the Quadram Institute Bioscience"
  meta_og_type: "website"
  meta_og_url: "https://quadram-institute-bioscience.github.io/" #TODO
  meta_og_image: "https://raw.githubusercontent.com/zerostaticthemes/jekyll-serif-theme/master/screenshots/tn.png" #TODO
  meta_og_description: "The Core Bioinformatics team at Quadram Institute Bioscience (Norwich, UK) delivers microbial genomics analysis, a shared compute platform and researcher training."
  meta_twitter_card: "summary"
  meta_twitter_site: "@QibCoreBioinfo"
  meta_twitter_creator: "@QibCoreBioinfo"

collections:
  services:
    output: true
  team:
    output: true
  tutorials:
    output: true

sass:
  indentWidth: 4
  style: compact # possible values: nested expanded compact compressed
  precision: 10

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-environment-variables
